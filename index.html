<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AvaliaTrilhos - Avaliação de Estações de Trem e Metrô</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabeçalho Principal -->
    <header>
        <h1>AvaliaTrilhos 🚆</h1>
        <p>Acompanhe e avalie as estações de metrô e trem de São Paulo.</p>
    </header>

    <!-- Área Principal -->
    <main>
        <!-- Seção do Formulário -->
        <section>
            <h2>Deixe sua Avaliação</h2>
            
            <form id="form-avaliacao">
                <!-- Campo 1: Seleção da Linha -->
                <div class="form-group">
                    <label for="linha">Linha:</label>
                    <select id="linha" name="linha">
                        <option value="">Selecione uma linha...</option>
                        <option value="linha1">Linha 1 - Azul</option>
                        <option value="linha2">Linha 2 - Verde</option>
                        <option value="linha3">Linha 3 - Vermelha</option>
                        <option value="linha4">Linha 4 - Amarela</option>
                        <option value="linha5">Linha 5 - Lilás</option>
                        <option value="linha6">Linha 6 - Laranja</option>
                        <option value="linha7">Linha 7 - Rubi</option>
                        <option value="linha8">Linha 8 - Diamante</option>
                        <option value="linha9">Linha 9 - Esmeralda</option>
                        <option value="linha10">Linha 10 - Turquesa</option>
                        <option value="linha11">Linha 11 - Coral</option>
                        <option value="linha12">Linha 12 - Safira</option>
                        <option value="linha13">Linha 13 - Jade</option>
                        <option value="linha15">Linha 15 - Prata</option>
                        <option value="linha17">Linha 17 - Ouro</option>
                    </select>
                </div>

                <!-- Campo 2: Nome da Estação -->
                <div class="form-group">
                    <label for="estacao">Estação:</label>
                    <select id="estacao" name="estacao">
                        <option value="">Selecione uma linha primeiro...</option>
                    </select>
                </div>

                <!-- Campo 3: Nota -->
                <div class="form-group">
                    <label for="nota">Sua Nota (1 a 5):</label>
                    <select id="nota" name="nota">
                        <option value="5">5 - Excelente ⭐⭐⭐⭐⭐</option>
                        <option value="4">4 - Boa ⭐⭐⭐⭐</option>
                        <option value="3">3 - Regular ⭐⭐⭐</option>
                        <option value="2">2 - Ruim ⭐⭐</option>
                        <option value="1">1 - Péssima ⭐</option>
                    </select>
                </div>

                <!-- Campo 4: Comentário livre -->
                <div class="form-group">
                    <label for="comentario">Sua Avaliação:</label>
                    <textarea id="comentario" rows="4" placeholder="Conte como foi sua experiência nessa estação..."></textarea>
                </div>

                <!-- Botão de Enviar -->
                <button type="submit">Publicar Avaliação</button>
            </form>
        </section>

        <!-- Seção onde as avaliações publicadas vão aparecer -->
        <section>
            <h2>Últimas Avaliações</h2>
            <div id="mural-avaliacoes">
                <p style="color: #64748b; font-style: italic;">Ainda não há avaliações cadastradas.</p>
            </div>
        </section>
    </main>

</body>
</html>
